fin(){const p=P(),f=p.f,r=fin(f),c=p.cur||'',drv=f.mode=='drv',ck=Object.values(f.ck).filter(Boolean).length;const n=(l,k)=>`<label>${l}<input type="number" step="any" value="${f[k]??''}" onchange="ui('${k}',this.value)"><small class="s" style="display:block;margin-top:2px">${HN[k]}</small></label>`,nm=y=>y!=null?Math.round(y).toLocaleString():'';

async function save(name,data){const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
try{if(window.claude&&claude.use){const D=await claude.use('downloads');if(D){await D.save({filename:name,data:blob});toast('Saved '+name);return}}}catch(e){if(e&&e.code=='declined'){toast('Download cancelled');return}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Downloading '+name)}
async function xp(t,all){const l=all?S.projects:[P()],nm='installation_'+(all?'portfolio':A(P().title).replace(/\W+/g,'_'))+'_'+new Date().toISOString().slice(0,10);

add(q+'Schedule',[['Sl','Task','FPR','Work %',...p.months.map(m=>'Plan '+MN(m)),...p.months.map(m=>'Actual '+MN(m)),'Remark'],...p.tasks.map((t,j)=>[j+1,t.name,t.fpr,t.w,...p.months.map(m=>t.p[m]??''),...p.months.map(m=>t.a[m]??''),t.n]),['','Target %','','',...s.rows.map(r=>f1(r.t))],['','Actual %','','',...p.months.map(()=>''),...s.rows.map(r=>f1(r.a))],['','Achievement %','','',...p.months.map(()=>''),...s.rows.map(r=>r.ach==null?'':f1(r.ach))]]);
add(q+'PSI',[['SL','Query','Answer'],...p.psi.map((x,j)=>[j+1,x.q,x.a])]);
const F=p.f;add(q+'Feasibility',[['Machinery / equipment',F.m],['Setup / building, land & structure',F.setup],['Development & consultancy',F.cons],['Foreign tour',F.tour],['Other investment',F.oth],['Working capital',F.wc||0],['Method',F.mode=='drv'?'Production-driven':'Flat annual benefit'],['Annual benefit (flat)',F.ben],['Annual opex',F.opex],['Life yrs',F.yrs],['Discount %',F.rate],['Salvage',F.salv],...(F.mode=='drv'?[['Monthly production',F.mp],['Growth %',F.g],['Eligible %',F.el],['Solvable %',F.sv],['Per-unit saving',F.pu],['Amount divisor',F.dv]]:[]),[],['Total investment',f.I],['Avg net cash flow/yr',f.cf],['Payback yrs',f.pb??''],['Discounted payback yrs',f.dpb??''],['NPV',f.npv],['IRR %',f.irr??''],['ROI per year %',f.roiY??''],['ROI whole life %',f.roi??''],['Verdict',f.ok?'Feasible':'Review'],[],['Year','Units','Eligible','Solvable','Savings','Net cash flow','Cumulative','Discounted CF','Cumulative disc.'],...f.rows.map(y=>[y.t,y.u??'',y.e??'',y.s??'',y.sav??'',y.cf,y.cum,y.dcf,y.dcum]),[],['Observations'],...L2(p.obs).filter(x=>x.trim()).map(x=>[x]),['Report info'],...L2(p.fa).filter(x=>x.trim()).map(x=>[x]),[],['Sl','Category','Done','Remarks'],...CK.map((c,j)=>[j+1,c[0],F.ck[j]?'Yes':'',F.rm[j]||''])])});

async function imp(file){if(!file)return;try{let j;if(/\.json$/i.test(file.name))j=JSON.parse(await file.text());else{if(!window.XLSX)throw Error('Excel library not loaded');const wb=XLSX.read(await file.arrayBuffer()),ws=wb.Sheets['_DATA'];if(!ws)throw Error('no _DATA sheet – use a file exported from this tool');j=JSON.parse(XLSX.utils.sheet_to_json(ws,{header:1}).map(r=>r[0]||'').join(''))}
if(!Array.isArray(j.projects)||!j.projects.length)throw Error('no items found');j.projects.forEach(p=>{p.id=uid();p.f=Object.assign(feas(),p.f)});
if($('#mode').value=='rep'){S={projects:j.projects};ci=0}else{ci=S.projects.length;S.projects.push(...j.projects)}
tab='dash';R();toast(j.projects.length+' item(s) loaded')}catch(e){toast('Import failed: '+e.message)}}
R();
